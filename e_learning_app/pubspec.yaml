name: e_learning_app
description: Elearning project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.8
  flutter_lints: ^6.0.0
  smooth_page_indicator: ^1.2.1
  flutter_hooks: ^0.21.2
  auto_route: ^10.1.0+1
  image_picker: ^1.1.2
  intl: ^0.20.2
  hooks_riverpod: ^2.5.1
  shared_preferences: ^2.2.2
  riverpod_cache: ^0.0.5
  flutter_riverpod: ^2.5.1
  riverpod_hook_mutation: ^1.0.0
  riverpod_annotation: ^2.6.1
  pinput: ^2.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^10.1.0
  build_runner: ^2.5.4
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.13.1
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  freezed: ^3.1.0
  json_serializable: ^6.9.5

flutter:
  generate: true 
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#0961F5"
  color_dark: "#000000"          
  image: assets/images/splash.png
  image_dark: assets/images/splash.png
  android: true
  ios: true
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  web: false

  android_12:
    image: assets/images/splash.png
    icon_background_color: "#0961F5"
    image_dark: assets/images/splash.png
    icon_background_color_dark: "#000000"

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png" 